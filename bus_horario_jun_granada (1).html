<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;600&display=swap');

  :root {
    --amber: #FFB800;
    --amber-dim: #CC9200;
    --dark: #0A0B0D;
    --panel: #111318;
    --panel2: #181C22;
    --border: #2A2F3A;
    --text: #E8ECF2;
    --muted: #6B7280;
    --green: #22C55E;
    --red: #EF4444;
    --blue: #3B82F6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  .header {
    width: 100%;
    background: var(--panel);
    border-bottom: 2px solid var(--amber);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .route-badge {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .bus-icon {
    font-size: 28px;
    filter: drop-shadow(0 0 8px var(--amber));
  }

  .route-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 3px;
    color: var(--amber);
    text-shadow: 0 0 20px rgba(255,184,0,0.4);
  }

  .route-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .clock-block {
    text-align: right;
  }

  .clock {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 30px;
    font-weight: 700;
    color: var(--amber);
    letter-spacing: 2px;
    text-shadow: 0 0 15px rgba(255,184,0,0.5);
  }

  .date-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* ── DIRECTION TABS ── */
  .direction-tabs {
    width: 100%;
    display: flex;
    background: var(--panel2);
    border-bottom: 1px solid var(--border);
  }

  .tab {
    flex: 1;
    padding: 12px 8px;
    text-align: center;
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    border-bottom: 3px solid transparent;
    transition: all 0.2s;
  }

  .tab.active {
    color: var(--amber);
    border-bottom-color: var(--amber);
    background: rgba(255,184,0,0.05);
  }

  /* ── PRÓXIMO AUTOBUS ── */
  .next-container {
    width: 100%;
    padding: 20px 20px 12px;
  }

  .next-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 4px solid var(--green);
    border-radius: 8px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    position: relative;
    overflow: hidden;
  }

  .next-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(90deg, rgba(34,197,94,0.06) 0%, transparent 60%);
    pointer-events: none;
  }

  .next-card.soon {
    border-left-color: var(--amber);
  }
  .next-card.soon::before {
    background: linear-gradient(90deg, rgba(255,184,0,0.08) 0%, transparent 60%);
  }

  .next-card.urgent {
    border-left-color: var(--red);
    animation: pulse-border 1s ease-in-out infinite alternate;
  }
  .next-card.urgent::before {
    background: linear-gradient(90deg, rgba(239,68,68,0.08) 0%, transparent 60%);
  }

  @keyframes pulse-border {
    from { box-shadow: 0 0 0 0 rgba(239,68,68,0.3); }
    to   { box-shadow: 0 0 0 6px rgba(239,68,68,0); }
  }

  .next-label-col {
    display: flex;
    flex-direction: column;
  }

  .next-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .next-time {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    line-height: 1;
    color: var(--text);
    letter-spacing: 2px;
  }

  .next-dest {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1px;
    margin-top: 4px;
  }

  .countdown-col {
    text-align: right;
  }

  .countdown-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    line-height: 1;
    color: var(--green);
  }
  .next-card.soon .countdown-num { color: var(--amber); }
  .next-card.urgent .countdown-num { color: var(--red); }

  .countdown-unit {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* ── STOP INFO ── */
  .stop-info {
    width: 100%;
    padding: 0 20px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .stop-dot {
    width: 8px; height: 8px;
    background: var(--amber);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--amber);
    flex-shrink: 0;
  }

  .stop-name {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  /* ── SCHEDULE TABLE ── */
  .table-section {
    width: 100%;
    padding: 0 20px 24px;
  }

  .table-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .schedule-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .col-header {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--amber);
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 8px 12px;
    background: rgba(255,184,0,0.08);
    border-radius: 4px;
    border: 1px solid rgba(255,184,0,0.2);
    margin-bottom: 4px;
    text-align: center;
  }

  .time-pill {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    padding: 7px 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 5px;
    margin-bottom: 5px;
    letter-spacing: 1px;
    text-align: center;
    transition: background 0.2s, border-color 0.2s;
  }

  .time-pill.active-time {
    background: rgba(34,197,94,0.12);
    border-color: var(--green);
    color: var(--green);
    box-shadow: 0 0 8px rgba(34,197,94,0.2);
  }

  .time-pill.past-time {
    color: var(--muted);
    border-color: #1E2229;
    background: #0D1014;
    text-decoration: line-through;
    text-decoration-color: #2A2F3A;
  }

  .time-pill.empty {
    background: transparent;
    border-color: transparent;
    visibility: hidden;
  }

  /* ── DAY TYPE BADGE ── */
  .day-badge {
    width: 100%;
    padding: 6px 20px 0;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: -4px;
  }

  .day-chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 20px;
    background: rgba(59,130,246,0.15);
    color: var(--blue);
    border: 1px solid rgba(59,130,246,0.3);
  }

  .day-chip.sat {
    background: rgba(255,184,0,0.12);
    color: var(--amber);
    border-color: rgba(255,184,0,0.3);
  }

  .day-chip.festivo {
    background: rgba(239,68,68,0.12);
    color: var(--red);
    border-color: rgba(239,68,68,0.3);
  }

  /* ── SEPARATOR ── */
  .sep {
    width: calc(100% - 40px);
    height: 1px;
    background: var(--border);
    margin: 4px 20px 16px;
  }

  .ticker {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--amber);
    color: var(--dark);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 6px 0;
    text-align: center;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="route-badge">
    <span class="bus-icon">🚌</span>
    <div>
      <div class="route-label">JUN ↔ GRANADA</div>
      <div class="route-sub">Línea interurbana · Avda. Granada</div>
    </div>
  </div>
  <div class="clock-block">
    <div class="clock" id="clock">--:--</div>
    <div class="date-label" id="dateLabel">--</div>
  </div>
</div>

<!-- DIRECTION TABS -->
<div class="direction-tabs">
  <div class="tab active" id="tab-jun" onclick="setDir('JUN')">⬆ Jun → Granada</div>
  <div class="tab" id="tab-gra" onclick="setDir('GRA')">⬇ Granada → Jun</div>
</div>

<!-- DAY BADGE -->
<div class="day-badge">
  <span class="day-chip" id="dayChip">Laborable</span>
</div>

<!-- STOP INFO -->
<div class="stop-info">
  <div class="stop-dot"></div>
  <span class="stop-name" id="stopLabel">Parada: Avda. Granada — Jun → Granada</span>
</div>

<!-- PRÓXIMO BUS -->
<div class="next-container">
  <div class="next-card" id="nextCard">
    <div class="next-label-col">
      <span class="next-tag">Próximo bus</span>
      <span class="next-time" id="nextTime">--:--</span>
      <span class="next-dest" id="nextDest">---</span>
    </div>
    <div class="countdown-col">
      <div class="countdown-num" id="countdownNum">--</div>
      <div class="countdown-unit">min</div>
    </div>
  </div>
</div>

<div class="sep"></div>

<!-- TABLE -->
<div class="table-section">
  <div class="table-title" id="tableTitle">Horario completo del día</div>
  <div class="schedule-grid" id="scheduleGrid"><!-- dynamic --></div>
</div>

<div class="ticker" id="ticker">🚍 Consulte el horario actualizado · Avda. Granada · Jun ↔ Granada</div>

<script>
// ─── SCHEDULES ───────────────────────────────────────────────
const schedules = {
  JUN: {
    SAB: ["08:45","10:25","11:50","13:50","16:45","18:05","19:50","21:30","22:55"],
    DOM: ["10:40","12:15","13:55","17:10","18:45","20:15"]
  },
  GRA: {
    SAB: ["09:15","11:15","13:15","14:45","17:30","19:15","20:30","22:20","23:30"],
    DOM: ["11:15","12:45","14:30","17:45","19:15","20:45"]
  }
};

// Spanish public holidays (MM-DD format, approximate national ones)
const festivos = ["01-01","01-06","04-17","04-18","05-01","08-15","10-12","11-01","12-06","12-08","12-25"];

// ─── STATE ───────────────────────────────────────────────────
let direction = 'JUN';

function getDayType(date) {
  const day = date.getDay(); // 0=sun,6=sat
  const mmdd = String(date.getMonth()+1).padStart(2,'0') + '-' + String(date.getDate()).padStart(2,'0');
  if (day === 0 || festivos.includes(mmdd)) return 'DOM';
  if (day === 6) return 'SAB';
  return 'LAB'; // weekday — fallback to SAB schedule (closest)
}

function getDayLabel(dayType) {
  if (dayType === 'SAB') return 'Sábado';
  if (dayType === 'DOM') return 'Domingo / Festivo';
  return 'Laborable';
}

function getDayClass(dayType) {
  if (dayType === 'SAB') return 'sat';
  if (dayType === 'DOM') return 'festivo';
  return '';
}

function timeToMinutes(t) {
  const [h,m] = t.split(':').map(Number);
  return h*60 + m;
}

function nowMinutes() {
  const d = new Date();
  return d.getHours()*60 + d.getMinutes();
}

function setDir(dir) {
  direction = dir;
  document.getElementById('tab-jun').classList.toggle('active', dir === 'JUN');
  document.getElementById('tab-gra').classList.toggle('active', dir === 'GRA');
  document.getElementById('stopLabel').textContent =
    dir === 'JUN'
      ? 'Parada: Avda. Granada — Jun → Granada'
      : 'Parada: Avda. Granada — Granada → Jun';
  render();
}

function render() {
  const now = new Date();
  const dayType = getDayType(now);
  // If laborable, use SAB as fallback and note it
  const effectiveDay = dayType === 'LAB' ? 'SAB' : dayType;
  const times = schedules[direction][effectiveDay];
  const cur = nowMinutes();

  // ── Day chip
  const chip = document.getElementById('dayChip');
  chip.textContent = getDayLabel(dayType === 'LAB' ? 'SAB' : dayType) + (dayType === 'LAB' ? ' (horario sábado)' : '');
  chip.className = 'day-chip ' + getDayClass(effectiveDay);

  // ── Next bus
  const nextTime = times.find(t => timeToMinutes(t) >= cur);
  const card = document.getElementById('nextCard');
  const numEl = document.getElementById('countdownNum');

  if (nextTime) {
    const diff = timeToMinutes(nextTime) - cur;
    document.getElementById('nextTime').textContent = nextTime;
    document.getElementById('nextDest').textContent =
      direction === 'JUN' ? '→ Granada' : '→ Jun';
    numEl.textContent = diff;
    card.className = 'next-card' + (diff <= 5 ? ' urgent' : diff <= 15 ? ' soon' : '');
  } else {
    document.getElementById('nextTime').textContent = '——';
    document.getElementById('nextDest').textContent = 'Sin más salidas hoy';
    numEl.textContent = '—';
    card.className = 'next-card';
  }

  // ── Table
  const SAB = schedules[direction]['SAB'];
  const DOM = schedules[direction]['DOM'];
  const max = Math.max(SAB.length, DOM.length);
  let html = `<div class="col-header">Sábados</div><div class="col-header">Dom / Festivos</div>`;

  for (let i = 0; i < max; i++) {
    const st = SAB[i] || null;
    const dt = DOM[i] || null;

    // determine style for current schedule
    const stClass = st
      ? (effectiveDay === 'SAB'
          ? (timeToMinutes(st) < cur ? 'past-time' : (st === nextTime && direction === direction ? 'active-time' : ''))
          : '')
      : 'empty';
    const dtClass = dt
      ? (effectiveDay === 'DOM'
          ? (timeToMinutes(dt) < cur ? 'past-time' : (dt === nextTime ? 'active-time' : ''))
          : '')
      : 'empty';

    html += `<div class="time-pill ${stClass}">${st || ''}</div>`;
    html += `<div class="time-pill ${dtClass}">${dt || ''}</div>`;
  }

  document.getElementById('scheduleGrid').innerHTML = html;

  // ── Ticker
  if (nextTime) {
    const diff = timeToMinutes(nextTime) - cur;
    document.getElementById('ticker').textContent =
      `🚍 Próximo bus en ${diff} min · ${nextTime} · ${direction === 'JUN' ? 'Jun → Granada' : 'Granada → Jun'} · Avda. Granada`;
  } else {
    document.getElementById('ticker').textContent =
      `🚍 Sin más salidas hoy · Consulte horario mañana · Avda. Granada`;
  }
}

function updateClock() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const ss = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent = `${hh}:${mm}`;

  const days = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const months = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  document.getElementById('dateLabel').textContent =
    `${days[now.getDay()]} ${now.getDate()} ${months[now.getMonth()]}`;
}

// Init
updateClock();
render();
setInterval(() => { updateClock(); render(); }, 10000); // refresh every 10s
</script>
</body>
</html>
